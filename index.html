<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тестовое задание для VERESK</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
    <div class="container">
        <div class="table__wrapper">
            <h2 class="table__title">Сумма значений массива</h2>

            <table class="table__table">
                <thead class="table__table-head">
                <tr>
                    <th>A</th>
                    <th>B</th>
                    <th>C</th>
                </tr>
                </thead>
                <tbody class="table__table-body" data-bind="foreach: array">
                <tr>
                    <td data-bind="text: a"></td>
                    <td data-bind="text: b"></td>
                    <td data-bind="text: a + b"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="js/knockout-3.5.1.min.js"></script>
<script src="js/script.js"></script>
</body>
</html>
